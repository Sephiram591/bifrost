site_name: bifrost
site_description: The rainbow bridge between your GDSFactory(X) pipeline and FDTD(X) simulation
repo_url: https://github.com/Sephiram591/bifrost
repo_name: Sephiram591/bifrost
edit_uri: edit/main/docs/
site_url: https://sephiram591.github.io/bifrost/
docs_dir: .
site_dir: _build/html
exclude_docs: |
  _build/
  zensical.yml
  notebooks/**

nav:
  - Home: index.md
  - Installation: installation.md
  - Getting started: getting-started.md
  - Widget Demo: live-demo.md
  - User guide:
      - Layer stacks and materials: guide/layer-stacks.md
      - Simulation Setup: guide/simulation-setup.md
      - Convergence testing: guide/convergence-testing.md
      - Inverse design: guide/inverse-design.md
      - Advanced: guide/advanced.md
  - Examples:
      - Waveguide bend: examples/waveguide-bend.md
      - Elevator coupler: examples/elevator-coupler.md
      - Directional coupler: examples/directional-coupler.md
      - Lithium niobate bend: examples/linbo3-bend.md
  - API reference
  - Development:
      - Contributing and tests: development.md
      - Geometry options: guide/options.md
      - Geometry model: guide/geometry-model.md
      - Diagnostics and timing: guide/diagnostics.md
      - Validation and benchmarks: validation.md
      - Changelog: changelog.md

theme:
  name: material
  logo: images/bifrost-icon-rounded-rectangle.svg
  favicon: images/bifrost-icon-rounded-square.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: ["..", "."]
      check_paths: true
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - https://fonts.googleapis.com/css2?family=Eczar:wght@400&display=swap
  - stylesheets/site-title.css
  - stylesheets/live-demo.css

extra_javascript:
  - javascripts/site-title.js

plugins:
  - search
  - api-autonav:
      modules: ["../bifrost"]
      api_root_uri: api
      nav_section_title: API reference
      exclude_private: true
  - mkdocstrings:
      enabled: true
      default_handler: python
      handlers:
        python:
          paths: [..]  # the repository root, so the docs build reads bifrost from source
          options:
            show_source: true
            docstring_style: google
            separate_signature: true
            show_signature_annotations: true
            members_order: alphabetical
            show_root_heading: true
            show_root_full_path: false
            summary: true
  - autorefs
