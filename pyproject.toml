[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core>=3.2,<5"]

[project]
name = "bifrost"
version = "0.1.0"
description = "The rainbow bridge between your GDSFactory(X) pipeline and FDTD(X) simulation"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Helaman Flores"}]
requires-python = ">=3.12,<3.15"
dependencies = [
  # gdsfactoryx (from PyPI) provides the `gdsfactory` import package, so it cannot share an environment with upstream gdsfactory
  "gdsfactoryx>=9.51.0",
  "fdtdx>=0.6.3",
  # fdtdx imports tidy3d. Without a floor pip can resolve tidy3d 2.10 (it prefers the newest xarray, which tidy3d 2.11+
  # caps), and 2.10 cannot read a user config written by tidy3d 2.12, so `import bifrost` crashes.
  "tidy3d>=2.12",
  "jax>=0.6",
  "numpy",
  "scipy<2",
  "shapely<3",
  "anywidget>=0.9",
  "manifold3d>=3.0",
  "traitlets",
  "imageio-ffmpeg",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "pytest-randomly", "ruff", "mypy", "marimo", "playwright"]
docs = ["zensical>=0.0.46,<0.1.0", "mkdocstrings[python]"]
meep = ["meep"]

[tool.flit.module]
name = "bifrost"

[tool.pytest.ini_options]
addopts = "--tb=short"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["docs/"]
