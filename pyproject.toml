[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core>=3.2,<5"]

[project]
name = "bifrost-photonics"
version = "0.3.0"
description = "The rainbow bridge between your GDSFactory(X) pipeline and FDTD(X) simulation"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Helaman Flores"}]
requires-python = ">=3.12,<3.15"
dependencies = [
  # gdsfactoryx (from PyPI) provides the `gdsfactory` import package, so it cannot share an environment with upstream gdsfactory.
  # 9.51.0.post3: includes JAX/JIT/AD and upstream v9.51.0 parity fixes plus LLM docs
  "gdsfactoryx>=9.51.0.post3",
  "fdtdx>=0.6.3",
  # fdtdx imports tidy3d. Without a floor pip can resolve tidy3d 2.10 (it prefers the newest xarray, which tidy3d 2.11+
  # caps), and 2.10 cannot read a user config written by tidy3d 2.12, so `import bifrost` crashes.
  "tidy3d>=2.12",
  "jax>=0.6",
  "numpy",
  "scipy<2",
  "shapely<3",
  "anywidget>=0.9",
  "manifold3d>=3.0",
  "traitlets",
  "imageio-ffmpeg",
]

[project.urls]
Homepage = "https://github.com/Sephiram591/bifrost"
Documentation = "https://sephiram591.github.io/bifrost/"
Issues = "https://github.com/Sephiram591/bifrost/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "pytest-randomly", "ruff", "mypy", "marimo", "playwright"]
docs = ["zensical>=0.0.66,<0.1.0", "mkdocstrings[python]", "marimo>=0.23"]
meep = ["meep"]

[tool.flit.module]
name = "bifrost"

[tool.pytest.ini_options]
addopts = "--tb=short"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["E402"]
"benchmarks/**" = ["E402"]
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
