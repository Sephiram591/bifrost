name: tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - run: uv pip install --system -e ".[dev,docs]"
      - run: ruff check --no-fix
      - run: mypy bifrost || true
      # the browser checks of the live demo (tests/test_demo_browser.py, tests/test_docs_site_browser.py)
      # and the strict docs build (tests/test_docs.py) run with the rest after exporting the demo notebook;
      # full simulations of the tutorial do not (they need a GPU: BIFROST_HARDWARE=1 pytest tests/test_docs.py -k hardware)
      - run: playwright install --with-deps chromium
      - run: make demo-notebook
      - run: pytest tests -x -q
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd js && npm ci && npm test && npm run typecheck
